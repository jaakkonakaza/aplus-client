name: Publish
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching gradle.properties, such as v0.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch tagged sources
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: bash scripts/check-release-version.sh "$RELEASE_TAG"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Verify build
        run: ./gradlew build

      - name: Verify published Kotlin and Scala consumers
        run: bash scripts/check-publication.sh
      - name: Check publishing credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY; do
            if [[ ! "${!name}" =~ [^[:space:]] ]]; then
              printf '%s must contain a non-whitespace value\n' "$name" >&2
              exit 1
            fi
          done
      - name: Publish to Maven Central
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral -PdocsRevision="$RELEASE_TAG"
