[versions]
kotlin = "2.4.21"
ktor = "3.6.1"
jsonSerialization = "1.13.0"
junit = "6.1.3"
kover = "0.9.11"
mavenPublish = "0.37.0"
scala = "3.9.0"
scaladoc = "3.10.1"
dokka = "2.3.0"

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }

dokkaJavadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
dokkaHtml = { id = "org.jetbrains.dokka", version.ref = "dokka" }

[libraries]
scaladoc = { group = "org.scala-lang", name = "scaladoc_3", version.ref = "scaladoc" }
scalaLibrary = { group = "org.scala-lang", name = "scala3-library_3", version.ref = "scala" }
ktorClientCore = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktorClientResources = { group = "io.ktor", name = "ktor-client-resources", version.ref = "ktor" }
ktorClientOkhttp = { group = "io.ktor", name = "ktor-client-okhttp-jvm", version.ref = "ktor" }
ktorClientMock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }

jsonSerialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "jsonSerialization" }

junitBom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit = { group = "org.junit.jupiter", name = "junit-jupiter" }
junitPlatformLauncher = { group = "org.junit.platform", name = "junit-platform-launcher" }
